[package]
name = "actool"
description = "Asset catalog compilation compatible with Xcode's actool."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "actool"
path = "src/main.rs"

[dependencies]
cf.workspace = true
libz-sys = { version = "1", features = ["static"] }
lzfse.workspace = true
png = "0.17"
serde_json = "1"

[build-dependencies]
cc = "1"
